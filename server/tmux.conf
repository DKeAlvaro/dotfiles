set -g mouse on

# App con ratón (Grok/pi): reenviar rueda. Si no, swipe = copy-mode.
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind-key -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'send-keys -M'"

bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X scroll-down
bind-key -T copy-mode MouseDown1Pane select-pane \; send-keys -X cancel
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X scroll-down
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X cancel
